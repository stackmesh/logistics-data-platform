name: logistics-data-platform

# Airflow services run with `docker compose --profile airflow up -d` (docs/airflow.md).
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: logistics-airflow:local
  profiles: ["airflow"]
  user: "${AIRFLOW_UID:-1000}:0"
  env_file:
    - path: .env.example
      required: true
    - path: .env
      required: false
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
  volumes:
    - airflow_logs:/opt/airflow/logs
  restart: unless-stopped

# Superset services run with `docker compose --profile superset up -d` (docs/superset.md).
x-superset-common: &superset-common
  build:
    context: .
    dockerfile: docker/superset/Dockerfile
  image: logistics-superset:local
  profiles: ["superset"]
  env_file:
    - path: .env.example
      required: true
    - path: .env
      required: false
  environment:
    SUPERSET_DB_HOST: superset-postgres
    SUPERSET_DB_PORT: "5432"

services:
  postgres:
    image: postgres:17
    container_name: logistics-postgres
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    command:
      - postgres
      - -c
      - "listen_addresses=*"
      - -c
      - max_connections=40
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - log_destination=stderr
      - -c
      - logging_collector=off
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d "
    shm_size: 1gb
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-15432}:5432"
    volumes:
      - logistics_pgdata:/var/lib/postgresql/data
      - ./requirements/reference/sql:/source-sql:ro
      - ./docker/postgres/01_init.sh:/docker-entrypoint-initdb.d/01_init.sh:ro
      - ./docker/postgres/03_bi_reader.sh:/docker-entrypoint-initdb.d/03_bi_reader.sh:ro
      - ./docker/postgres/02_warehouse.sql:/docker/init/02_warehouse.sql:ro
      - ./docker/postgres/healthcheck.sh:/usr/local/bin/docker-healthcheck.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "bash /usr/local/bin/docker-healthcheck.sh"]
      interval: 15s
      timeout: 10s
      start_period: 180s
      retries: 80
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: logistics-pipeline:local
    container_name: logistics-pipeline
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "scripts.run_pipeline", "--mode", "${PIPELINE_MODE:-full}"]
    volumes:
      - pipeline_artifacts:/app/artifacts
      - ml_models:/app/ml/artifacts
    restart: "no"
    init: true

  tests:
    image: logistics-pipeline:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistics-tests
    profiles: ["test"]
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - python -m etl.migrate && python -m pytest -q -p no:cacheprovider
    volumes:
      - pipeline_artifacts:/app/artifacts
      - ml_models:/app/ml/artifacts
    restart: "no"
    init: true

  airflow-postgres:
    image: postgres:17
    container_name: logistics-airflow-postgres
    profiles: ["airflow"]
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    # The warehouse's POSTGRES_* come from the same env files; this server takes its own AIRFLOW_DB_* instead.
    entrypoint:
      - bash
      - -c
      - >-
        export POSTGRES_USER="$$AIRFLOW_DB_USER" POSTGRES_PASSWORD="$$AIRFLOW_DB_PASSWORD"
        POSTGRES_DB="$$AIRFLOW_DB_NAME" && exec docker-entrypoint.sh postgres
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$AIRFLOW_DB_USER\" -d \"$$AIRFLOW_DB_NAME\""]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: logistics-airflow-init
    command: ["version"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      _AIRFLOW_DB_MIGRATE: "true"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    container_name: logistics-airflow-apiserver
    command: ["api-server"]
    ports:
      - "127.0.0.1:${AIRFLOW_PUBLISH_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: logistics-airflow-scheduler
    command: ["scheduler"]
    # LocalExecutor: DAG tasks run here, so the scheduler mounts the pipeline's artifact volumes.
    volumes:
      - airflow_logs:/opt/airflow/logs
      - pipeline_artifacts:/opt/pipeline/app/artifacts
      - ml_models:/opt/pipeline/app/ml/artifacts
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
      postgres:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    container_name: logistics-airflow-dag-processor
    command: ["dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 30s
      start_period: 60s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  superset-postgres:
    image: postgres:17
    container_name: logistics-superset-postgres
    profiles: ["superset"]
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    # Superset's metadata database; takes SUPERSET_DB_* instead of the warehouse's POSTGRES_*.
    entrypoint:
      - bash
      - -c
      - >-
        export POSTGRES_USER="$$SUPERSET_DB_USER" POSTGRES_PASSWORD="$$SUPERSET_DB_PASSWORD"
        POSTGRES_DB="$$SUPERSET_DB_NAME" && exec docker-entrypoint.sh postgres
    volumes:
      - superset_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$SUPERSET_DB_USER\" -d \"$$SUPERSET_DB_NAME\""]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  superset-init:
    <<: *superset-common
    container_name: logistics-superset-init
    command: ["/app/smart_logistics/init.sh"]
    depends_on:
      superset-postgres:
        condition: service_healthy
    restart: "no"

  superset:
    <<: *superset-common
    container_name: logistics-superset
    ports:
      - "127.0.0.1:${SUPERSET_PUBLISH_PORT:-18088}:8088"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    depends_on:
      superset-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Creates or updates the warehouse connection, datasets, charts, and dashboard; safe to re-run.
  superset-provision:
    <<: *superset-common
    container_name: logistics-superset-provision
    command: ["/app/.venv/bin/python", "/app/smart_logistics/provision.py"]
    environment:
      SUPERSET_DB_HOST: superset-postgres
      SUPERSET_DB_PORT: "5432"
      SUPERSET_URL: http://superset:8088
      BI_DB_HOST: postgres
      BI_DB_PORT: "5432"
    depends_on:
      superset:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  logistics_pgdata:
  pipeline_artifacts:
  ml_models:
  airflow_pgdata:
  airflow_logs:
  superset_pgdata:
